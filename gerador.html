  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:32px 28px; }

  .page-card {
    background:var(--panel); border:1px solid var(--border); border-radius:10px;

  .page-card.visible { display:block; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const BOILERPLATE = [
  /^sim$/i, /^n[ãa]o$/i, /^\d+$/, /^\d+[,\.]\d+\s*mm$/i,
  /^\d+\s*[xX]\s*\d+/, /^t\d+$/i, /^acoplado$/i, /^triplex$/i,
  /^0,5\s*mm$/i, /^plastificar$/i,
  /^descri[çc][ãa]o$/i, /^tipo$/i, /^medidas$/i, /^qtd[e]?\.?$/i,
  /^embalagem$/i, /^volume$/i,
];

function isBoilerplate(line) {
  const l = line.trim();
  if (!l || l.length < 2) return true;
  return BOILERPLATE.some(rx => rx.test(l));
}

async function extrairComponentes(page) {
  const textContent = await page.getTextContent();
  const pdfH = page.getViewport({ scale: 1 }).height;
  const yMin = pdfH * 0.08;
  const yMax = pdfH * 0.60;

  const linhas = textContent.items
    .filter(it => { const y = it.transform[5]; return y >= yMin && y <= yMax; })
    .map(it => it.str.trim())
    .filter(s => s.length > 0);

  const comps = [];
  for (const linha of linhas) {
    if (!isBoilerplate(linha)) {
      const matchQty = linha.match(/^\(?(\d+)\s*[Xx]\s*/);
      const qty = matchQty ? parseInt(matchQty[1]) : 1;
      const nome = matchQty ? linha.replace(matchQty[0], '').replace(/\)?$/, '').trim() : linha;
      if (nome) comps.push({ qty, name: nome });
    }
  }
  const merged = [];
  for (const c of comps) {
    if (merged.length > 0 && /^n[°º\.]\s*\d+/i.test(c.name)) {
      merged[merged.length - 1].name += ' ' + c.name;
    } else {
      merged.push(c);
    }
  }
  const OBS_PATTERN = /\bpara\s+(cima|baixo|frente|tr[áa]s|fora|dentro)\b|\bcom\s+pintura\b|\bsem\s+pintura\b|\bpintura\s+para\b|\baten[çc][ãa]o\b|\borientar\b/i;
  const components = [];
  const obsItems = [];
  for (const c of merged) {
    if (OBS_PATTERN.test(c.name) && c.name.split(' ').length >= 3) {
      obsItems.push(c.name);
    } else {
      components.push(c);
    }
  }
  return { components, obs: obsItems.join(' / ') };
}

let pagesData = [];

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') processar(file);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) processar(e.target.files[0]);
});

async function processar(file) {
  pagesData = [];
  document.getElementById('pagesGrid').innerHTML = '';
  document.getElementById('btnGerar').classList.remove('visible');

  const nomeSugerido = file.name.replace(/\.pdf$/i, '').replace(/_/g, ' ').toUpperCase();
  document.getElementById('produtoNome').value = nomeSugerido;
  document.getElementById('configBox').classList.add('visible');

  mostrarStatus('Lendo PDF...');

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const total = pdf.numPages;

  mostrarStatus(`Processando ${total} páginas...`, 0);

  for (let i = 1; i <= total; i++) {
    mostrarStatus(`Processando página ${i} de ${total}...`, (i-1)/total * 100);

    const page = await pdf.getPage(i);
    const scale = 1.6;   // suficiente para TV; 2.2 gerava arquivo grande demais
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const imgBase64 = canvas.toDataURL('image/jpeg', 0.82);

    const { components, obs } = await extrairComponentes(page);
    const opName = 'CAMADA ' + String(i).padStart(2, '0');
    pagesData.push({ img: imgBase64, op: opName, components, obs });
    adicionarCard(i - 1, opName, imgBase64, components, obs);
  }

  mostrarStatus(`${total} páginas processadas! Revise os componentes e clique em Gerar.`, 100);
  document.getElementById('btnGerar').classList.add('visible');
}

function adicionarCard(idx, opName, imgBase64, comps, obs = '') {
  const grid = document.getElementById('pagesGrid');
  const card = document.createElement('div');
  card.className = 'page-card visible';
  card.id = 'card' + idx;

  const img = document.createElement('img');
  img.className = 'page-thumb';
  img.src = imgBase64;
  img.alt = opName;
  card.appendChild(img);

  const body = document.createElement('div');
  body.className = 'page-body';
  body.innerHTML = `
    <div class="page-op">${opName}</div>
    <div class="comp-list" id="compList${idx}"></div>
    <button class="btn-add" onclick="addComp(${idx})">+ Adicionar componente</button>
    <div class="obs-row">
      <label>OBS:</label>
      <input type="text" id="obs${idx}" placeholder="Ex: FURAÇÕES PARA CIMA">
    </div>
  `;
  card.appendChild(body);
  grid.appendChild(card);

  comps.forEach(c => addCompRow(idx, c.qty, c.name));
  if (obs) document.getElementById('obs' + idx).value = obs;
}

function addComp(idx) { addCompRow(idx, 1, ''); }

function addCompRow(idx, qty, nome) {
  const list = document.getElementById('compList' + idx);
  const row = document.createElement('div');
  row.className = 'comp-row';
  row.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <span style="font-size:9px;color:#71717A;letter-spacing:0.05em;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;">Qtd</span>
      <input class="qty" type="number" value="${qty}" min="1" max="99">
    </div>
    <input class="nome" type="text" value="${nome}" placeholder="Nome do componente">
    <button class="btn-del" onclick="this.parentElement.remove()">×</button>
  `;
  list.appendChild(row);
}

function mostrarStatus(txt, pct) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  document.getElementById('statusTxt').textContent = txt;
  if (pct !== undefined) document.getElementById('progressFill').style.width = pct + '%';
}

function coletarDados() {
  const produto = document.getElementById('produtoNome').value.trim() || 'PRODUTO';
  const ops = pagesData.map((p, idx) => {
    const rows = document.querySelectorAll('#compList' + idx + ' .comp-row');
    const components = [];
    rows.forEach(row => {
      const qty = parseInt(row.querySelector('.qty').value) || 1;
      const name = row.querySelector('.nome').value.trim();
      if (name) components.push({ qty, name });
    });
    const obs = document.getElementById('obs' + idx)?.value.trim() || '';
    return { op: p.op, obs, components };
  });
  const tempo = parseInt(document.getElementById('tempoPadrao').value, 10) || 5;
  return { produto, ops, tempo };
}

function gerarHTML() {
  const { produto, ops, tempo } = coletarDados();

  const imgsJS = pagesData.map((p, i) => `    ${i}: "${p.img}"`).join(',\n');
  const opsJS  = JSON.stringify(ops, null, 2);
  const tempoSeg = tempo;

  const fotos = fotosBase64;
  const carouselImgsHtml = fotos.map((src, i) =>
    `<img class="carousel-img${i===0?' ativo':''}" src="${src}">`
  ).join('');
  const carouselBtnsHtml = fotos.length > 1
    ? '<button class="carousel-btn prev" onclick="carouselPrev()">&#8249;</button><button class="carousel-btn next" onclick="carouselNext()">&#8250;</button>'
    : '';
  const carouselDotsHtml = fotos.length > 1
    ? '<div class="carousel-dots">' + fotos.map((_, i) =>
        `<div class="carousel-dot${i===0?' ativo':''}" onclick="carouselGoto(${i})"></div>`
      ).join('') + '</div>'
    : '';
  const fotoHtml = fotos.length
    ? `<div id="fotoProduto"><div class="carousel">${carouselImgsHtml}${carouselBtnsHtml}</div>${carouselDotsHtml}</div>`
    : '';
  const carouselJs = fotos.length > 1
    ? `var _ci=0;var _cimgs=document.querySelectorAll('.carousel-img'),_cdots=document.querySelectorAll('.carousel-dot');function carouselGoto(n){_cimgs[_ci].className='carousel-img';if(_cdots[_ci])_cdots[_ci].className='carousel-dot';_ci=(n+_cimgs.length)%_cimgs.length;_cimgs[_ci].className='carousel-img ativo';if(_cdots[_ci])_cdots[_ci].className='carousel-dot ativo';}function carouselNext(){carouselGoto(_ci+1);}function carouselPrev(){carouselGoto(_ci-1);}setInterval(carouselNext,5000);`
    : '';

  const html = `<!DOCTYPE html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Compatibilidade Smart TV: sem flex gap, sem inset, sem aspect-ratio, sem hex de 8 digitos.

  #timerDisplay{font-family:'JetBrains Mono',monospace;font-size:5.5vh;color:var(--accent);min-width:10vh;text-align:center;font-weight:700;line-height:1;flex-shrink:0;}
  .progress-bar-wrap{flex:1;height:0.8vh;background:var(--panel);border-radius:4px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--accent);width:100%;border-radius:4px;}

  /* COLUNA DIREITA */
  #fotoProduto{flex-shrink:0;border-bottom:1px solid var(--border);padding-bottom:1vh;}
  .carousel{position:relative;width:100%;padding-top:75%;overflow:hidden;border-radius:8px;background:var(--bg);}
  .carousel-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s;}
  .carousel-img.ativo{opacity:1;}
  .carousel-btn{position:absolute;top:50%;margin-top:-2vh;background:rgba(0,0,0,0.55);border:none;color:#fff;font-size:2.6vh;cursor:pointer;padding:0.4vh 1vh;border-radius:4px;z-index:10;line-height:1;}
  .carousel-btn.prev{left:4px;} .carousel-btn.next{right:4px;}
  .carousel-dots{text-align:center;margin-top:0.6vh;}
  .carousel-dot{display:inline-block;width:0.8vh;height:0.8vh;border-radius:50%;background:var(--border);margin:0 2px;cursor:pointer;}
  .carousel-dot.ativo{background:var(--accent);}
  .section-title{font-size:1.5vh;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;flex-shrink:0;font-weight:700;}
  #mapaTrilhos{overflow-y:auto;flex:1;min-height:0;}
  .op-item{background:var(--panel);padding:1.2vh;border-left:4px solid var(--border);border-radius:0 5px 5px 0;font-size:2vh;font-weight:600;flex-shrink:0;cursor:pointer;color:var(--text-muted);margin-bottom:3px;}
  .op-item.ativo{border-left-color:var(--accent);background:rgba(255,92,31,0.08);color:var(--accent);font-weight:800;}

  /* FOOTER + SPLASH */
  .footer{text-align:center;padding:0.5vh;font-family:'JetBrains Mono',monospace;font-size:1.3vh;letter-spacing:0.08em;color:var(--gray);flex-shrink:0;border-top:1px solid var(--border);}
  @keyframes pulseEtapa{0%{transform:scale(1);}40%{transform:scale(1.04);}100%{transform:scale(1);}}
  .pulse{animation:pulseEtapa .35s ease-out;}
  #overlayInicio{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer;transition:opacity .5s;}
  #overlayInicio>*+*{margin-top:2vh;}
  #overlayInicio.sumindo{opacity:0;}
  .ol-logo{font-size:2.4vh;font-weight:700;color:var(--line);letter-spacing:-0.03em;}
  .ol-logo span{color:var(--accent);}
  .ol-title{font-size:4.5vh;font-weight:800;color:var(--text);letter-spacing:-0.02em;}
  .ol-sub{font-size:2.6vh;color:var(--text-muted);}
  .ol-badge{background:var(--accent);color:#fff;font-size:2vh;font-weight:700;padding:1.2vh 3vh;border-radius:6px;}
</style>
</head>
<body>
<div class="header">
  <div class="rp-logo">
    <span class="rp-wordmark">ritmoprod<span>.</span></span>
    <span class="rp-sep">/</span>
    <span class="produto-nome">${produto}</span>
  </div>
  <div class="controls">
    <input type="number" id="tempoInput" min="1" max="9999" value="${tempoSeg}">
    <button class="btn" onclick="iniciarTempoManual()">&#9654; Iniciar</button>
    <button class="btn stop" onclick="pararTimer()">&#9632; Parar</button>
    <button class="btn fs" onclick="toggleFullscreen()">&#9974; Tela Cheia</button>
  </div>
</div>
<div class="container">
  <div class="left">
    <div id="etapaPrincipal">AGUARDANDO</div>
    <div id="obsDisplay"></div>
    <div id="componentesGrade"><span class="vazio">Carregando sequencia...</span></div>
    <div id="desenhoCamada"><div id="desenhoPh">Desenho da camada</div></div>
    <div class="timer-row">
      <div id="timerDisplay">--s</div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>
  <div class="right">
    ${fotoHtml}
    <div class="section-title">Sequência de Camadas</div>
    <div id="mapaTrilhos"></div>
  </div>
</div>
<div class="footer" id="rodape">PADRÃO DE EMBALAGEM · ${produto} · ritmoprod.</div>
<div id="overlayInicio" onclick="iniciarTela()">
  <div class="ol-logo">ritmoprod<span>.</span></div>
  <div class="ol-title">Painel de Embalagem</div>
  <div class="ol-sub">${produto}</div>
  <div class="ol-badge">Iniciando...</div>
</div>
<script>
  var IMGS={
${imgsJS}
  };
  var opsData=${opsJS};
  var totalEtapas=opsData.length;
  var TEMPO_PADRAO=${tempoSeg};
  var intervalo=null,etapaAtual=0,tRestante=0,tCiclo=0,_iniciado=false;
  var _imgCache={};

  window.onerror=function(m){try{document.getElementById('rodape').textContent='ERRO: '+m;}catch(e){}return false;};

  function qs(n){try{var m=new RegExp('[?&]'+n+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}catch(e){return null;}}
  function tempoConfigurado(){
    var u=parseInt(qs('t'),10); if(u>0)return u;
    var el=document.getElementById('tempoInput');
    var v=el?parseInt(el.value,10):0;
    return v>0?v:TEMPO_PADRAO;
  }

  function init(){
    var c=document.getElementById('mapaTrilhos'); c.innerHTML='';
    opsData.forEach(function(op,idx){
      var d=document.createElement('div');
      d.id='step'+idx; d.className='op-item';
      d.textContent=op.op+' · '+op.components.length+' itens';
      d.onclick=function(){etapaAtual=idx;destacarEtapa();};
      c.appendChild(d);
    });
    var t=qs('t'); if(t&&parseInt(t,10)>0)document.getElementById('tempoInput').value=parseInt(t,10);
  }

  function tocarSom(){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ctx=new AC();var osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.type='sine';osc.frequency.value=880;g.gain.setValueAtTime(0.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);osc.start();osc.stop(ctx.currentTime+0.4);}catch(e){}}

  function iniciarCiclo(seg){
    if(intervalo){clearInterval(intervalo);intervalo=null;}
    tCiclo=seg; tRestante=seg;
    atualizar(tRestante,tCiclo); destacarEtapa();
    intervalo=setInterval(function(){
      tRestante--; atualizar(tRestante,tCiclo);
      if(tRestante<=0){tocarSom();etapaAtual=(etapaAtual+1)%totalEtapas;tRestante=tCiclo;destacarEtapa();}
    },1000);
  }
  function iniciarTempoManual(){var v=tempoConfigurado();if(!v||v<=0)return;etapaAtual=0;iniciarCiclo(v);}

  function pararTimer(){
    if(intervalo){clearInterval(intervalo);intervalo=null;}
    document.getElementById('timerDisplay').textContent='--s';
    var bar=document.getElementById('progressBar');bar.style.transition='none';bar.style.width='100%';
    document.getElementById('etapaPrincipal').textContent='AGUARDANDO';
    document.getElementById('componentesGrade').innerHTML='<span class="vazio">Parado. Clique Iniciar.</span>';
    document.getElementById('obsDisplay').style.display='none';
    var its=document.querySelectorAll('.op-item');
    for(var i=0;i<its.length;i++)its[i].className='op-item';
    for(var k in _imgCache){if(_imgCache.hasOwnProperty(k))_imgCache[k].className='';}
    document.getElementById('desenhoPh').style.display='block';
    document.getElementById('desenhoPh').textContent='Desenho da camada';
  }

  function scrollParaEtapa(el){
    try{
      var box=document.getElementById('mapaTrilhos');
      var top=el.offsetTop,h=el.offsetHeight;
      if(top<box.scrollTop)box.scrollTop=top;
      else if(top+h>box.scrollTop+box.clientHeight)box.scrollTop=top+h-box.clientHeight;
    }catch(e){}
  }

  function mostrarDesenho(idx){
    var area=document.getElementById('desenhoCamada');
    var ph=document.getElementById('desenhoPh');
    var src=IMGS[idx];
    if(!src){
      for(var k in _imgCache){if(_imgCache.hasOwnProperty(k))_imgCache[k].className='';}
      ph.style.display='block'; ph.textContent=opsData[idx].op; return;
    }
    ph.style.display='none';
    if(!_imgCache[idx]){
      var im=document.createElement('img');
      im.alt=opsData[idx].op; im.src=src;
      area.appendChild(im); _imgCache[idx]=im;
    }
    var alvo=String(idx);
    for(var j in _imgCache){if(_imgCache.hasOwnProperty(j))_imgCache[j].className=(j===alvo?'ativo':'');}
  }

  function destacarEtapa(){
    var its=document.querySelectorAll('.op-item');
    for(var i=0;i<its.length;i++)its[i].className='op-item';
    var el=document.getElementById('step'+etapaAtual);
    if(el){el.className='op-item ativo';scrollParaEtapa(el);}
    var op=opsData[etapaAtual];
    var ep=document.getElementById('etapaPrincipal');
    ep.innerHTML=op.op+' <span class="tot">/ '+totalEtapas+'</span>';
    ep.className=''; void ep.offsetWidth; ep.className='pulse';
    var obs=document.getElementById('obsDisplay');
    if(op.obs){obs.innerHTML='&#9888; '+op.obs;obs.style.display='block';}else{obs.style.display='none';}
    var grade=document.getElementById('componentesGrade');
    grade.innerHTML=op.components.map(function(c){
      return '<div class="comp-card"><span class="comp-card-qty">&times;'+c.qty+'</span><span class="comp-card-nome">'+c.name+'</span></div>';
    }).join('');
    mostrarDesenho(etapaAtual);
  }

  function atualizar(s,total){
    document.getElementById('timerDisplay').textContent=s+'s';
    var pct=(s/(total||1))*100;
    var bar=document.getElementById('progressBar');
    bar.style.transition=(s===total?'none':'width 1s linear');
    bar.style.width=pct+'%';
  }

  function pedirFullscreen(){
    try{
      var el=document.documentElement;
      var f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
      if(!f)return;
      var r=f.call(el);
      if(r&&typeof r['catch']==='function')r['catch'](function(){});
    }catch(e){}
  }
  function sairFullscreen(){try{var d=document;var f=d.exitFullscreen||d.webkitExitFullscreen||d.mozCancelFullScreen||d.msExitFullscreen;if(f)f.call(d);}catch(e){}}
  function emFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);}
  function toggleFullscreen(){
    var btn=document.querySelector('.btn.fs');
    if(!emFullscreen()){pedirFullscreen();if(btn)btn.innerHTML='&times; Sair';}
    else{sairFullscreen();if(btn)btn.innerHTML='&#9974; Tela Cheia';}
  }
  document.addEventListener('fullscreenchange',function(){var b=document.querySelector('.btn.fs');if(b&&!emFullscreen())b.innerHTML='&#9974; Tela Cheia';});

  /* Inicia sozinho: a TV nao tem mouse nem teclado. */
  function iniciarTela(){
    if(_iniciado)return; _iniciado=true;
    var o=document.getElementById('overlayInicio');
    if(o){o.className='sumindo';setTimeout(function(){o.style.display='none';},500);}
    iniciarTempoManual();
  }

  /* Auto-atualizacao: detecta nova publicacao e recarrega sozinho.
     Caminho principal: compara ETag/Last-Modified a cada 3 min.
     Rede de seguranca: se o servidor nao mandar esses headers, recarrega a cada 30 min
     de qualquer forma, desde que a rede esteja respondendo (evita cair em tela de erro
     quando a TV perde a internet). O reload periodico tambem recupera a TV de
     travamentos de memoria do navegador depois de horas ligada. */
  var _tag=null,_redeOk=false,_semHeader=false;
  function checarAtualizacao(){
    if(location.protocol.indexOf('http')!==0||!window.fetch)return;
    try{
      fetch(location.pathname+'?_v='+(new Date()).getTime(),{method:'HEAD',cache:'no-store'})
        .then(function(r){
          _redeOk=true;
          var t=r.headers.get('etag')||r.headers.get('last-modified');
          if(!t){_semHeader=true;return;}
          if(_tag===null){_tag=t;return;}
          if(t!==_tag)location.reload();
        })['catch'](function(){_redeOk=false;});
    }catch(e){_redeOk=false;}
  }
  function reloadSeguranca(){ if(_redeOk)location.reload(); }

  /* Esconde o cursor do controle remoto quando parado. */
  var _cur;
  function armarCursor(){clearTimeout(_cur);_cur=setTimeout(function(){document.body.style.cursor='none';},5000);}
  document.addEventListener('mousemove',function(){document.body.style.cursor='default';armarCursor();});

  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.code==='Space'||e.keyCode===32){
      e.preventDefault();
      if(intervalo){clearInterval(intervalo);intervalo=null;document.getElementById('timerDisplay').textContent='II';}
      else{iniciarCiclo(tCiclo||tempoConfigurado());}
    }else if(e.code==='ArrowRight'||e.keyCode===39||e.code==='Enter'||e.keyCode===13){
      e.preventDefault();etapaAtual=(etapaAtual+1)%totalEtapas;tRestante=tCiclo;destacarEtapa();
    }else if(e.code==='ArrowLeft'||e.keyCode===37){
      e.preventDefault();etapaAtual=(etapaAtual-1+totalEtapas)%totalEtapas;tRestante=tCiclo;destacarEtapa();
    }
  });

  window.addEventListener('load',function(){
    init();
    armarCursor();
    setTimeout(iniciarTela,2500);
    checarAtualizacao();
    setInterval(checarAtualizacao,180000);
    setInterval(reloadSeguranca,1800000);
  });
  ${carouselJs}
<\/script>
</body>
</html>`;

  const mb = html.length / 1048576;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  const aviso = mb > 8
    ? ` <b style="color:var(--warn)">ATENÇÃO: ${mb.toFixed(1)} MB — pesado para Smart TV. Reduza o número de páginas do PDF ou teste antes de publicar.</b>`
    : ` (${mb.toFixed(1)} MB)`;
  mostrarStatus('', 100);
  document.getElementById('statusTxt').innerHTML =
    `Arquivo <b>index.html</b> baixado${aviso}. Agora suba ele no GitHub em <b>tv/index.html</b> — a TV atualiza sozinha em até 3 minutos.`;
}

let fotosBase64 = [];
function previewFoto(input) {
  const area = document.getElementById('fotoPreviewArea');
  fotosBase64 = []; area.innerHTML = '';
  if (!input.files.length) return;
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      fotosBase64.push(e.target.result);
      const img = document.createElement('img');
      img.src = e.target.result;
      img.style.cssText = 'height:72px;border-radius:5px;border:1px solid var(--border);object-fit:cover;';
      area.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}
</script>
<script>
/* Registra o app. Só funciona em https (ou localhost) — aberto como arquivo
   local o navegador ignora, sem erro. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
