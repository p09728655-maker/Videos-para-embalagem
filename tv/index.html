<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Embalagem · aguardando publicação</title>
<style>
  /* Placeholder compativel com navegador de Smart TV: sem gap, sem inset, sem aspect-ratio. */
  :root{--bg:#0A0A0B;--border:#3F3F46;--line:#E4E4E7;--accent:#FF5C1F;--text-muted:#A1A1AA;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:Arial,Helvetica,sans-serif;background:#0A0A0B;background:var(--bg);
       color:#E4E4E7;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:4vh;cursor:none;}
  .logo{font-size:2.6vh;font-weight:700;color:var(--line);letter-spacing:-0.03em;margin-bottom:3vh;}
  .logo span{color:var(--accent);}
  h1{font-size:5vh;font-weight:800;letter-spacing:-0.02em;margin-bottom:2vh;}
  p{font-size:2.6vh;color:var(--text-muted);line-height:1.6;max-width:70vw;}
  .badge{margin-top:4vh;border:2px solid var(--border);border-radius:8px;padding:1.6vh 3vh;
         font-size:2vh;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="logo">ritmoprod<span>.</span></div>
  <h1>Nenhum painel publicado</h1>
  <p>Gere o painel no computador e substitua este arquivo em <b>tv/index.html</b>.<br>
     Esta tela atualiza sozinha assim que a publicação sair.</p>
  <div class="badge">Aguardando publicação</div>
<script>
  /* Mesma checagem de atualizacao do painel: recarrega quando o arquivo mudar. */
  var _tag=null,_redeOk=false;
  function checarAtualizacao(){
    if(location.protocol.indexOf('http')!==0||!window.fetch)return;
    try{
      fetch(location.pathname+'?_v='+(new Date()).getTime(),{method:'HEAD',cache:'no-store'})
        .then(function(r){
          _redeOk=true;
          var t=r.headers.get('etag')||r.headers.get('last-modified');
          if(!t)return;
          if(_tag===null){_tag=t;return;}
          if(t!==_tag)location.reload();
        })['catch'](function(){_redeOk=false;});
    }catch(e){_redeOk=false;}
  }
  checarAtualizacao();
  setInterval(checarAtualizacao,120000);
  setInterval(function(){if(_redeOk)location.reload();},1800000);
</script>
</body>
</html>
