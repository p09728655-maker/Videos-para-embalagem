<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sem isto, abrir /tv (sem barra final) faz o navegador resolver ativo.json
     como /ativo.json e tudo da 404. Tambem permite servir este player na raiz. -->
<base href="/tv/">
<title>RitmoPatrimar · Embalagem</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="../icones/icone-192.png">
<link rel="apple-touch-icon" href="../icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TV Embalagem">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="../supabase-config.js"></script>
<style>
  /* Player da TV.
     Compatibilidade com navegador de Smart TV (Tizen ~Chrome 76, webOS ~Chrome 68):
     sem flex gap (84+), sem inset (87+), sem aspect-ratio (88+), sem min() (79+),
     sem hex de 8 digitos (62+). Tipografia em vh para escalar de 720p a 4K. */
  :root{
    --bg:#0A0A0B;--panel:#18181B;--border:#3F3F46;
    --gray:#71717A;--line:#E4E4E7;
    --accent:#FF5C1F;
    --warn:#EAB308;--error:#DC2626;
    --text:#E4E4E7;--text-muted:#A1A1AA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Inter',Arial,Helvetica,sans-serif;background:#0A0A0B;background:var(--bg);
       color:#E4E4E7;color:var(--text);display:flex;flex-direction:column;overflow:hidden;}

  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:center;padding:1vh 1.4vw;
          border-bottom:1px solid var(--border);flex-shrink:0;}
  .rp-logo{display:flex;align-items:center;min-width:0;}
  .rp-logo>*+*{margin-left:8px;}
  .rp-marca{height:3.4vh;width:auto;display:block;}
  .rp-sep{color:var(--border);font-size:2vh;font-weight:300;}
  .produto-nome{font-size:2.4vh;font-weight:800;color:var(--text);white-space:nowrap;
                overflow:hidden;text-overflow:ellipsis;}
  /* Na TV nao ha mouse nem teclado: os controles so atrapalham. Ficam ocultos
     e reaparecem ao mover o mouse, o que cobre o uso no computador sem
     precisar de modo ou parametro na URL. */
  .controls{display:flex;align-items:center;flex-shrink:0;opacity:0;
            pointer-events:none;transition:opacity .25s;}
  .controls.visivel{opacity:1;pointer-events:auto;}
  .controls>*+*{margin-left:8px;}
  .controls input[type=number]{width:9vh;padding:0.8vh 1vh;border-radius:6px;border:1px solid var(--border);
       background:var(--panel);color:var(--text);font-family:'JetBrains Mono',monospace;
       font-size:2vh;text-align:center;font-weight:700;}
  .controls input[type=number]:focus{outline:none;border-color:var(--accent);}
  .btn{padding:0.9vh 1.6vh;border-radius:6px;border:none;background:var(--accent);color:#fff;
       font-weight:700;font-size:1.7vh;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .btn.stop{background:var(--error);}
  .btn.fs{background:var(--panel);color:var(--text);border:1px solid var(--border);}

  /* LAYOUT */
  .container{display:flex;flex:1;overflow:hidden;min-height:0;}
  .left{width:78%;padding:1.2vh 1.1vw;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
  .left>*+*{margin-top:1vh;}
  .right{width:22%;padding:1.2vh 0.9vw;border-left:1px solid var(--border);overflow:hidden;
         display:flex;flex-direction:column;min-height:0;}
  .right>*+*{margin-top:1vh;}

  #etapaPrincipal{background:var(--accent);color:#fff;padding:0.7vh 2vh;border-radius:8px;
                  font-size:4.6vh;font-weight:800;text-align:center;flex-shrink:0;line-height:1.05;}
  #etapaPrincipal .tot{font-size:2.4vh;font-weight:600;opacity:0.55;}

  #obsDisplay{background:rgba(234,179,8,0.13);border:2px solid var(--warn);border-radius:6px;
              padding:0.9vh 2vh;font-size:3vh;font-weight:800;color:var(--warn);text-align:center;
              flex-shrink:0;display:none;text-transform:uppercase;line-height:1.15;}

  /* Na coluna da direita os componentes deixam de empurrar o desenho: a area da
     imagem passa a ser a mesma em toda camada, com 3 ou com 8 pecas. */
  #componentesGrade{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
  #componentesGrade>*+*{margin-top:0.7vh;}
  /* Ninguem rola a tela de uma TV: com muitos componentes os cartoes encolhem
     em degraus ate caberem, em vez de sobrar barra de rolagem. */
  #componentesGrade.d1 .comp-card{padding:0.6vh 1vh;}
  #componentesGrade.d1 .comp-card-qty{font-size:3.4vh;margin-right:1vh;}
  #componentesGrade.d1 .comp-card-nome{font-size:1.9vh;}
  #componentesGrade.d1>*+*{margin-top:0.5vh;}
  #componentesGrade.d2 .comp-card{padding:0.45vh 0.9vh;}
  #componentesGrade.d2 .comp-card-qty{font-size:2.8vh;margin-right:0.8vh;}
  #componentesGrade.d2 .comp-card-nome{font-size:1.6vh;}
  #componentesGrade.d2>*+*{margin-top:0.35vh;}
  #componentesGrade.d3 .comp-card{padding:0.3vh 0.7vh;}
  #componentesGrade.d3 .comp-card-qty{font-size:2.2vh;margin-right:0.6vh;}
  #componentesGrade.d3 .comp-card-nome{font-size:1.35vh;}
  #componentesGrade.d3>*+*{margin-top:0.25vh;}
  /* Produto publicado sem a coluna: o desenho toma a largura inteira. */
  body.sem-componentes .right{display:none;}
  body.sem-componentes .left{width:100%;}

  /* SO O DESENHO
     A folha do desenhista ja e 16:9 e ja traz camada e componentes escritos
     nela. Neste modo a tela nao repete nada disso: saem logo, coluna,
     faixa da camada, cronometro e rodape, e a folha ocupa a tela toda.
     Ficam de pe so duas coisas que a folha nao garante: a OBS, digitada pelo
     PPCP, e um fio de progresso que mostra o ritmo da troca de camada. */
  body.so-desenho .rp-logo{display:none;}
  /* Os botoes ficam. Antes este modo ocultava o cabecalho inteiro e levava
     embora o unico jeito de sair pela tela: quem entrasse aqui sem saber da
     tecla D ficava preso no desenho, e na TV da fabrica nem ha teclado. Eles
     saem do fluxo para nao roubar altura da folha e continuam invisiveis ate
     alguem mover o mouse — a TV parada segue mostrando so o desenho. */
  body.so-desenho .header{position:fixed;right:0;bottom:0.7vh;z-index:8;padding:0;
       border-bottom:none;background:transparent;pointer-events:none;}
  /* Embaixo, e nao no alto: no alto eles cobririam a faixa da OBS, e aviso de
     furacao encoberto — ainda que por cinco segundos — e erro de embalagem.
     Aqui encostam so num canto do desenho, com alguem de mouse na mao. */
  body.so-desenho .controls{padding:1vh 1.4vw;background:rgba(10,10,11,0.72);
       border-radius:10px 0 0 0;}
  body.so-desenho .right{display:none;}
  body.so-desenho .footer{display:none;}
  body.so-desenho .left{width:100%;padding:0;position:relative;}
  body.so-desenho .left>*+*{margin-top:0;}
  body.so-desenho #etapaPrincipal{display:none;}
  body.so-desenho #desenhoCamada{border:none;border-radius:0;background:#0A0A0B;background:var(--bg);}
  /* A OBS flutua sobre o desenho em vez de empurra-lo: o aviso de furacao nao
     pode sumir, mas tambem nao pode roubar altura da folha. */
  body.so-desenho #obsDisplay{position:absolute;top:0;left:0;right:0;z-index:7;
       border-width:0 0 2px 0;border-radius:0;background:rgba(26,26,16,0.92);}
  body.so-desenho .timer-row{position:absolute;left:0;right:0;bottom:0;z-index:7;}
  body.so-desenho #timerDisplay,body.so-desenho #btnPausa{display:none;}
  body.so-desenho .progress-bar-wrap{height:0.7vh;border-radius:0;background:rgba(255,255,255,0.12);}
  body.so-desenho .progress-bar{border-radius:0;}
  #componentesGrade .vazio{color:var(--text-muted);font-size:2.2vh;padding:1vh;}
  .comp-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;
             padding:0.8vh 1.2vh;display:flex;align-items:center;flex-shrink:0;}
  .comp-card-qty{font-family:'JetBrains Mono',monospace;font-size:4.2vh;font-weight:700;
                 color:var(--accent);line-height:1;flex-shrink:0;margin-right:1.2vh;}
  .comp-card-nome{font-size:2.2vh;font-weight:700;color:var(--text);line-height:1.15;}

  #desenhoCamada{background:var(--panel);border:1px solid var(--border);border-radius:8px;flex:1;
                 min-height:0;min-width:0;position:relative;overflow:hidden;}
  #desenhoCamada img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none;}
  #desenhoCamada img.ativo{display:block;}
  #desenhoPh{position:absolute;top:50%;left:0;width:100%;text-align:center;margin-top:-1.2vh;
             color:var(--gray);font-size:2.4vh;}

  /* Pausa por toque: num tablet, para mostrar a camada para alguem, nao ha
     teclado para o atalho de espaco. */
  #desenhoCamada{cursor:pointer;}
  .nav-cam{position:absolute;top:50%;margin-top:-4vh;width:7vh;height:8vh;z-index:6;
           background:rgba(10,10,11,0.72);border:1px solid var(--border);border-radius:8px;
           color:var(--text);font-size:4vh;font-weight:700;line-height:8vh;text-align:center;
           cursor:pointer;display:none;}
  .nav-cam.ant{left:1.2vh;} .nav-cam.prox{right:1.2vh;}
  /* Sem selo sobre o desenho: em qualquer canto ele tapava parte do PDF.
     O proprio timer sinaliza a pausa, ficando amarelo junto com a barra. */
  #timerDisplay.pausado{color:var(--warn);}
  .progress-bar.pausado{background:var(--warn);}
  #desenhoCamada.pausado .nav-cam{display:block;}

  .timer-row{display:flex;align-items:center;flex-shrink:0;}
  .timer-row>*+*{margin-left:1.2vw;}
  #timerDisplay{font-family:'JetBrains Mono',monospace;font-size:5.5vh;color:var(--accent);
                min-width:10vh;text-align:center;font-weight:700;line-height:1;flex-shrink:0;}
  /* Tocar na imagem tambem pausa, mas ninguem descobre isso sozinho. */
  #btnPausa{flex-shrink:0;background:var(--panel);border:1px solid var(--border);
            border-radius:8px;color:var(--text);font-size:2.6vh;font-weight:700;
            padding:0.9vh 2.2vh;cursor:pointer;font-family:inherit;white-space:nowrap;}
  #btnPausa:hover{border-color:var(--accent);color:var(--accent);}
  #btnPausa.pausado{background:var(--warn);border-color:var(--warn);color:#1A1A1A;}
  .progress-bar-wrap{flex:1;height:0.8vh;background:var(--panel);border-radius:4px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--accent);width:100%;border-radius:4px;}

  #fotoProduto{flex-shrink:0;border-bottom:1px solid var(--border);padding-bottom:1vh;display:none;}
  .carousel{position:relative;width:100%;padding-top:75%;overflow:hidden;border-radius:8px;background:var(--bg);}
  .carousel-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;
                opacity:0;transition:opacity .4s;}
  .carousel-img.ativo{opacity:1;}
  .section-title{flex-shrink:0;font-size:1.5vh;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;
                 flex-shrink:0;font-weight:700;}
  #mapaTrilhos{display:flex;flex-wrap:wrap;flex:0 0 auto;flex-shrink:0;overflow:hidden;}
  .op-item{background:var(--panel);padding:0.6vh 1vh;border:1px solid var(--border);
           border-radius:5px;font-size:1.7vh;font-weight:700;flex-shrink:0;cursor:pointer;
           color:var(--text-muted);margin:0 4px 4px 0;font-family:'JetBrains Mono',monospace;}
  .op-item.ativo{border-color:var(--accent);background:rgba(255,92,31,0.14);
                 color:var(--accent);font-weight:800;}

  .footer{text-align:center;padding:0.5vh;font-family:'JetBrains Mono',monospace;font-size:1.3vh;
          letter-spacing:0.08em;color:var(--gray);flex-shrink:0;border-top:1px solid var(--border);}
  @keyframes pulseEtapa{0%{transform:scale(1);}40%{transform:scale(1.04);}100%{transform:scale(1);}}
  .pulse{animation:pulseEtapa .35s ease-out;}

  /* SPLASH / ESTADOS */
  #tela{position:fixed;top:0;left:0;right:0;bottom:0;background:#1A1A1A;display:flex;
        flex-direction:column;align-items:center;justify-content:center;z-index:999;
        transition:opacity .5s;text-align:center;padding:4vh;}
  #tela>*+*{margin-top:2vh;}
  #tela.sumindo{opacity:0;}
  .ol-logo-img{width:20vh;max-width:260px;display:block;}
  .ol-nome{font-size:4.4vh;font-weight:800;color:#E8E8E8;letter-spacing:0.19em;
           text-indent:0.19em;line-height:1;}
  .ol-pulso{width:28vh;max-width:320px;display:block;}
  .ol-sub{font-size:2.8vh;color:var(--text-muted);font-weight:600;}
  /* Em espera a frase e o conteudo da tela: tem que ser lida da linha, a 4 m. */
  .ol-sub.espera{font-size:4.6vh;color:#E8E8E8;font-weight:800;}
  .ol-erro{font-size:2.2vh;color:var(--warn);font-weight:600;max-width:70vw;line-height:1.5;}
  .ol-dica{font-size:1.8vh;color:var(--gray);max-width:70vw;line-height:1.5;}
</style>
</head>
<body>

<div class="header">
  <div class="rp-logo">
    <img class="rp-marca" src="../logo/patrimar.png" alt="Patrimar Móveis">
    <span class="rp-sep">/</span>
    <span class="produto-nome" id="produtoNome">—</span>
  </div>
  <div class="controls">
    <input type="number" id="tempoInput" min="1" max="9999" value="5">
    <button class="btn" onclick="iniciarTempoManual()">&#9654; Iniciar</button>
    <button class="btn stop" onclick="pararTimer()">&#9632; Parar</button>
    <button class="btn fs" id="btnSoDesenho" onclick="alternarSoDesenho()">&#9635; Só o desenho</button>
    <button class="btn fs" onclick="toggleFullscreen()">&#9974; Tela Cheia</button>
  </div>
</div>

<div class="container">
  <div class="left">
    <div id="etapaPrincipal">AGUARDANDO</div>
    <div id="obsDisplay"></div>
    <div id="desenhoCamada" onclick="alternarPausa()">
      <div id="desenhoPh">Desenho da camada</div>
      <div class="nav-cam ant" onclick="irCamada(-1, event)">&#8249;</div>
      <div class="nav-cam prox" onclick="irCamada(1, event)">&#8250;</div>
    </div>
    <div class="timer-row">
      <div id="timerDisplay">--s</div>
      <button id="btnPausa" onclick="alternarPausa()">&#10073;&#10073; Pausar</button>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>
  <div class="right">
    <div id="fotoProduto"><div class="carousel" id="carousel"></div></div>
    <div class="section-title">Componentes desta camada</div>
    <div id="componentesGrade"><span class="vazio">Carregando...</span></div>
    <div class="section-title">Camadas</div>
    <div id="mapaTrilhos"></div>
  </div>
</div>

<div class="footer" id="rodape">RITMOPATRIMAR · EMBALAGEM</div>

<div id="tela" onclick="pularSplash()">
  <img class="ol-logo-img" src="../logo/patrimar.png" alt="Patrimar Móveis">
  <div class="ol-nome">RITMOPATRIMAR</div>
  <svg class="ol-pulso" viewBox="0 0 340 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 26 H126 L140 26 L150 8 L162 40 L172 26 L186 26 H338"
          stroke="#FF5C1F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="ol-sub" id="telaSub">Carregando painel...</div>
  <div class="ol-erro" id="telaErro" style="display:none"></div>
  <div class="ol-dica" id="telaDica" style="display:none"></div>
</div>

<script>
/* ------------------------------------------------------------------
   Player fixo. Nunca muda quando troca o produto.
   Le tv/ativo.json -> descobre qual painel exibir
   Le paineis/<slug>/dados.json -> monta a tela
   As imagens das camadas sao arquivos, carregados sob demanda: o navegador
   da Smart TV nao aguenta dezenas de imagens em memoria de uma vez.
   ------------------------------------------------------------------ */

var ATIVO_URL = 'ativo.json';   /* reserva, se o Supabase nao responder */
var fonte = '';                 /* 'supabase' ou 'arquivos' — aparece no rodape */
var painel = null;        /* dados.json carregado */
var baseDir = '';         /* ../paineis/<slug>/ */
var slugAtual = null;
var carimboAtual = null;

var intervalo = null, etapaAtual = 0, tRestante = 0, tCiclo = 0;
/* Exibicao: o que vem publicado no painel (biblioteca) e o que foi trocado
   aqui na tela. O override e so desta sessao e cai na troca de produto —
   quem manda no que fica na TV continua sendo a biblioteca. */
var compPainel = true, soDesenhoPainel = false, soDesenhoLocal = null;
var imgCache = {}, splashFeita = false, redeOk = false;
/* Comandos vindos da biblioteca (embalagem_config): pausa e recarga do player.
   Guarda-se o ultimo valor visto para agir so na virada — assim o comando de
   longe nao desfaz a pausa feita aqui na tela, no toque.
   recargaVista comeca indefinido: a primeira leitura so registra o carimbo que
   ja estava la, senao a TV recarregaria em loop a cada partida. */
var pausaRemota = null, recargaVista, comandosSuspensosAte = 0;
var emEspera = false;     /* TV sem produto escolhido — e um estado valido, nao erro */

function $(id){ return document.getElementById(id); }
window.onerror = function(m){ try{ $('rodape').textContent = 'ERRO: ' + m; }catch(e){} return false; };

function qs(n){
  try{ var m = new RegExp('[?&]'+n+'=([^&#]*)').exec(location.search);
       return m ? decodeURIComponent(m[1]) : null; }catch(e){ return null; }
}

/* ---------- estados da tela de abertura ---------- */
function mostrarErro(msg, dica){
  var t = $('tela');
  t.className = ''; t.style.display = 'flex'; t.style.opacity = '1';
  $('telaSub').style.display = 'none';
  $('telaSub').className = 'ol-sub';
  $('telaErro').style.display = 'block'; $('telaErro').textContent = msg;
  if (dica){ $('telaDica').style.display = 'block'; $('telaDica').textContent = dica; }
  splashFeita = false;
}
/* Ninguem escolheu produto: a TV fica em espera, sem nada rodando. Antes ela
   caia no arquivo de reserva e prendia um produto fixo na tela para sempre. */
function mostrarEspera(){
  emEspera = true;
  painel = null;
  var t = $('tela');
  t.className = ''; t.style.display = 'flex'; t.style.opacity = '1';
  $('telaSub').style.display = 'block';
  $('telaSub').className = 'ol-sub espera';
  $('telaSub').textContent = 'Nenhum produto na TV';
  $('telaErro').style.display = 'none';
  $('telaDica').style.display = 'block';
  $('telaDica').textContent = 'Escolha o vídeo na biblioteca do RitmoPatrimar. ' +
                              'A TV liga sozinha em até 1 minuto.';
  document.title = 'RitmoPatrimar · Embalagem';
  splashFeita = false;
}
function pularSplash(){
  if (splashFeita || !painel) return;
  splashFeita = true;
  var t = $('tela');
  t.className = 'sumindo';
  setTimeout(function(){ t.style.display = 'none'; }, 500);
}

/* ---------- carga ---------- */
function buscarJSON(url){
  return fetch(url + '?_v=' + (new Date()).getTime(), { cache: 'no-store' })
    .then(function(r){
      if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status);
      return r.json();
    });
}

/* Fonte principal: Supabase. Se ele nao responder, cai nos arquivos estaticos
   do repositorio — assim uma indisponibilidade do banco nao apaga a TV. */
function carregarDoSupabase(){
  if (!window.SUPA || !window.supaGet) return Promise.reject(new Error('config ausente'));
  var forcado = qs('p');
  var pegarSlug = forcado
    ? Promise.resolve({ slug: forcado, carimbo: null })
    : window.supaGet('embalagem_config?id=eq.1&select=painel_ativo,atualizado_em')
        .then(function(rows){
          var c = rows && rows[0];
          return { slug: c && c.painel_ativo ? String(c.painel_ativo) : '',
                   carimbo: c ? c.atualizado_em : null };
        });

  return pegarSlug.then(function(info){
    if (!info.slug){
      var vazio = new Error('nenhum painel ativo');
      vazio.semPainel = true;   /* o banco respondeu: e TV vazia, nao queda */
      throw vazio;
    }
    return window.supaGet('embalagem_paineis?slug=eq.' + encodeURIComponent(info.slug) +
                          '&select=slug,produto,tempo,camadas,fotos,opcoes,atualizado_em')
      .then(function(rows){
        var r = rows && rows[0];
        if (!r) throw new Error('painel "' + info.slug + '" nao existe no banco');
        slugAtual = r.slug;
        carimboAtual = (info.carimbo || '') + '|' + (r.atualizado_em || '');
        baseDir = '';
        fonte = 'supabase';
        painel = { produto: r.produto, tempo: r.tempo, opcoes: r.opcoes || {},
                   atualizado: r.atualizado_em,
                   camadas: (r.camadas || []).map(function(c){
                     return { op: c.op, obs: c.obs, componentes: c.componentes || [],
                              img: c.img ? window.supaImagem(c.img) : null };
                   }),
                   fotos: (r.fotos || []).map(function(f){ return window.supaImagem(f); }) };
      });
  });
}

function carregarDeArquivos(){
  return buscarJSON(ATIVO_URL).then(function(a){
    var slug = (a && a.painel) ? String(a.painel) : '';
    var forcado = qs('p');
    if (forcado) slug = forcado;
    if (!slug) throw new Error('ativo.json sem painel definido');
    slugAtual = slug;
    carimboAtual = a ? (a.atualizado || null) : null;
    baseDir = '../paineis/' + slug + '/';
    fonte = 'arquivos';
    return buscarJSON(baseDir + 'dados.json').then(function(d){
      painel = { produto: d.produto, tempo: d.tempo, opcoes: d.opcoes || {},
                 atualizado: d.gerado || (a && a.atualizado) || null,
                 camadas: (d.camadas || []).map(function(c){
                   return { op: c.op, obs: c.obs, componentes: c.componentes || [],
                            img: c.img ? (baseDir + c.img) : null };
                 }),
                 fotos: (d.fotos || []).map(function(f){ return baseDir + f; }) };
    });
  });
}

function carregar(){
  if (!window.fetch){
    mostrarErro('Este navegador é antigo demais para o painel.',
                'O aparelho não suporta os recursos necessários. Use um TV Box Android ou um mini PC.');
    return;
  }
  carregarDoSupabase().then(function(){
    redeOk = true; montar();
  })['catch'](function(e1){
    /* Sem produto escolhido a TV fica em espera. O arquivo de reserva so entra
       quando o banco nao responde — ele nunca decide sozinho o que exibir. */
    if (e1 && e1.semPainel){ redeOk = true; irParaEspera(); return; }
    carregarDeArquivos().then(function(){
      redeOk = true; montar();
    })['catch'](function(e2){
      redeOk = false;
      mostrarErro('Não consegui carregar o vídeo.',
                  'Supabase: ' + (e1 && e1.message ? e1.message : e1) +
                  '  ·  Arquivos: ' + (e2 && e2.message ? e2.message : e2));
    });
  });
}

/* ---------- montagem ---------- */
function montar(){
  emEspera = false;
  var p = painel;
  if (!p || !p.camadas || !p.camadas.length){
    mostrarErro('O vídeo publicado está sem camadas.', 'Gere o produto novamente e publique a pasta.');
    return;
  }
  /* Como o produto foi publicado:
     opcoes.componentes === false -> desenho maior, sem a coluna
     opcoes.soDesenho  === true   -> so o desenho, em tela cheia */
  var opc = p.opcoes || {};
  compPainel = !(opc.componentes === false);
  soDesenhoPainel = (opc.soDesenho === true);
  if (qs('comp') === '0') compPainel = false;
  if (qs('comp') === '1') compPainel = true;
  if (qs('so') === '0') soDesenhoPainel = false;
  if (qs('so') === '1') soDesenhoPainel = true;
  soDesenhoLocal = null;          /* produto novo volta a obedecer a biblioteca */
  aplicarExibicao();
  document.title = 'RitmoPatrimar · ' + (p.produto || 'Embalagem');
  $('produtoNome').textContent = p.produto || '—';
  $('telaSub').className = 'ol-sub';
  $('telaSub').style.display = 'block';
  $('telaSub').textContent = p.produto || '';
  pintarRodape();
  var tUrl = parseInt(qs('t'), 10);
  $('tempoInput').value = (tUrl > 0) ? tUrl : (p.tempo > 0 ? p.tempo : 5);

  var c = $('mapaTrilhos'); c.innerHTML = '';
  p.camadas.forEach(function(cam, idx){
    var d = document.createElement('div');
    d.id = 'step' + idx; d.className = 'op-item';
    d.textContent = String(idx + 1).length < 2 ? ('0' + (idx + 1)) : String(idx + 1);
    d.title = (cam.op || '') + ' · ' + (cam.componentes || []).length + ' itens';
    d.onclick = function(){
      if (intervalo){ clearInterval(intervalo); intervalo = null; }
      etapaAtual = idx; tRestante = tCiclo; destacarEtapa(); pintarPausa();
    };
    c.appendChild(d);
  });

  if (p.fotos && p.fotos.length){
    var car = $('carousel');
    p.fotos.forEach(function(f, i){
      var im = document.createElement('img');
      im.className = 'carousel-img' + (i === 0 ? ' ativo' : '');
      im.src = f;
      car.appendChild(im);
    });
    $('fotoProduto').style.display = 'block';
    if (p.fotos.length > 1) fotoTimer = setInterval(proximaFoto, 5000);
  }

  setTimeout(function(){ pularSplash(); iniciarTempoManual(); }, 2200);
}

/* Rodape: quem olha de perto precisa saber se o padrao na tela e o vigente.
   A data e a mesma versao que a biblioteca mostra — nao ha outro numero. */
function pintarRodape(){
  var p = painel; if (!p) return;
  var versao = (p.atualizado && window.dataCurtaBR) ? window.dataCurtaBR(p.atualizado) : '';
  $('rodape').textContent = 'PADRÃO DE EMBALAGEM · ' + (p.produto || '') +
                            (versao ? ' · VERSÃO ' + versao : '') +
                            ' · RITMOPATRIMAR' +
                            (fonte === 'arquivos' ? ' · MODO RESERVA' : '') +
                            (pausaRemota ? ' · PAUSADA PELA BIBLIOTECA' : '');
}

/* Uma funcao so decide as tres telas possiveis, para nao haver dois lugares
   mexendo em body.className e brigando entre si. */
function modoSoDesenho(){
  return (soDesenhoLocal === null) ? soDesenhoPainel : soDesenhoLocal;
}
function colunaVisivel(){ return !document.body.className; }
function aplicarExibicao(){
  var so = modoSoDesenho();
  document.body.className = so ? 'so-desenho' : (compPainel ? '' : 'sem-componentes');
  var b = $('btnSoDesenho');
  if (b) b.innerHTML = so ? '&#9636; Tela completa' : '&#9635; Só o desenho';
  if (colunaVisivel()) ajustarComponentes();
}
/* Botao e tecla D valem so nesta sessao e so nesta tela: quem decide o que a
   TV exibe continua sendo a biblioteca, senao um clique aqui prenderia um modo
   na TV sem ninguem saber onde desfazer. */
function alternarSoDesenho(){
  soDesenhoLocal = !modoSoDesenho();
  aplicarExibicao();
}

var fotoAtual = 0, fotoTimer = null;
function proximaFoto(){
  var fs = document.querySelectorAll('.carousel-img');
  if (fs.length < 2) return;
  fs[fotoAtual].className = 'carousel-img';
  fotoAtual = (fotoAtual + 1) % fs.length;
  fs[fotoAtual].className = 'carousel-img ativo';
}

/* O campo do cabecalho e a fonte de verdade; montar() ja o inicializa com o
   tempo do produto (ou o ?t= da URL). Comparar com painel.tempo aqui fazia o
   valor padrao do HTML passar por alteracao manual e vencer o do produto. */
function tempoConfigurado(){
  var u = parseInt(qs('t'), 10); if (u > 0) return u;
  var el = $('tempoInput'); var v = el ? parseInt(el.value, 10) : 0;
  return v > 0 ? v : 5;
}

/* ---------- ciclo ---------- */
function tocarSom(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var ctx = new AC(), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = 880;
    g.gain.setValueAtTime(0.35, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  }catch(e){}
}


/* Pausa e navegacao manual, para apresentar a sequencia a alguem num tablet.
   O mesmo toque retoma; enquanto pausado aparecem as setas de camada. */
function estaPausado(){ return !intervalo; }

function pintarPausa(){
  var area = $('desenhoCamada'), t = $('timerDisplay'), b = $('progressBar'), bt = $('btnPausa');
  if (!area) return;
  var p = estaPausado();
  area.className = p ? 'pausado' : '';
  if (t){ t.className = p ? 'pausado' : ''; if (p && painel) t.textContent = 'II'; }
  if (b){ b.className = p ? 'progress-bar pausado' : 'progress-bar'; }
  if (bt){
    bt.className = p ? 'pausado' : '';
    bt.innerHTML = p ? '&#9654; Continuar' : '&#10073;&#10073; Pausar';
  }
}

function alternarPausa(){
  if (!painel) return;
  if (intervalo){ clearInterval(intervalo); intervalo = null; }
  else { iniciarCiclo(tCiclo || tempoConfigurado()); }
  pintarPausa();
}

/* As setas param o ciclo: quem esta navegando quer ficar na camada escolhida. */
function irCamada(passo, ev){
  if (ev && ev.stopPropagation) ev.stopPropagation();
  if (!painel) return;
  if (intervalo){ clearInterval(intervalo); intervalo = null; }
  var n = painel.camadas.length;
  etapaAtual = (etapaAtual + passo + n) % n;
  tRestante = tCiclo;
  destacarEtapa();
  pintarPausa();
}

function iniciarCiclo(seg){
  if (intervalo){ clearInterval(intervalo); intervalo = null; }
  tCiclo = seg; tRestante = seg;
  atualizar(tRestante, tCiclo); destacarEtapa();
  intervalo = setInterval(function(){
    tRestante--; atualizar(tRestante, tCiclo);
    if (tRestante <= 0){
      tocarSom();
      etapaAtual = (etapaAtual + 1) % painel.camadas.length;
      tRestante = tCiclo; destacarEtapa();
    }
  }, 1000);
  pintarPausa();   /* depois do setInterval: antes dele, intervalo ainda e null */
}
function iniciarTempoManual(){
  if (!painel) return;
  var v = tempoConfigurado(); if (!v || v <= 0) return;
  etapaAtual = 0; iniciarCiclo(v);
}
function pararTimer(){
  if (intervalo){ clearInterval(intervalo); intervalo = null; }
  pintarPausa();
  $('timerDisplay').textContent = '--s';
  var bar = $('progressBar'); bar.style.transition = 'none'; bar.style.width = '100%';
  $('etapaPrincipal').textContent = 'AGUARDANDO';
  $('componentesGrade').innerHTML = '<span class="vazio">Parado. Clique Iniciar.</span>';
  $('obsDisplay').style.display = 'none';
  var its = document.querySelectorAll('.op-item');
  for (var i = 0; i < its.length; i++) its[i].className = 'op-item';
  for (var k in imgCache){ if (imgCache.hasOwnProperty(k)) imgCache[k].className = ''; }
  $('desenhoPh').style.display = 'block';
  $('desenhoPh').textContent = 'Desenho da camada';
}

function scrollParaEtapa(el){
  try{
    var box = $('mapaTrilhos'), top = el.offsetTop, h = el.offsetHeight;
    if (top < box.scrollTop) box.scrollTop = top;
    else if (top + h > box.scrollTop + box.clientHeight) box.scrollTop = top + h - box.clientHeight;
  }catch(e){}
}

/* Imagem criada na primeira vez que a camada aparece e mantida em cache:
   evita redecodificar a cada volta do ciclo, que na TV causa piscada. */
function mostrarDesenho(idx){
  var area = $('desenhoCamada'), ph = $('desenhoPh');
  var cam = painel.camadas[idx];
  var arq = cam ? cam.img : null;
  if (!arq){
    for (var k in imgCache){ if (imgCache.hasOwnProperty(k)) imgCache[k].className = ''; }
    ph.style.display = 'block'; ph.textContent = cam ? (cam.op || '') : ''; return;
  }
  ph.style.display = 'none';
  if (!imgCache[idx]){
    var im = document.createElement('img');
    im.alt = cam.op || ''; im.src = arq;
    im.onerror = function(){ ph.style.display = 'block'; ph.textContent = 'Imagem não encontrada: ' + arq; };
    area.appendChild(im); imgCache[idx] = im;
  }
  var alvo = String(idx);
  for (var j in imgCache){ if (imgCache.hasOwnProperty(j)) imgCache[j].className = (j === alvo ? 'ativo' : ''); }
}


/* Reduz os cartoes em degraus ate a lista caber na coluna. Na TV nao ha como
   rolar, entao um componente que ficasse fora da tela simplesmente nao seria
   embalado. */
function ajustarComponentes(){
  var g = $('componentesGrade');
  if (!g || !colunaVisivel()) return;
  var graus = ['', 'd1', 'd2', 'd3'];
  for (var i = 0; i < graus.length; i++){
    g.className = graus[i];
    if (g.scrollHeight <= g.clientHeight + 1) return;
  }
  /* Passou do menor degrau: a lista e longa demais para a coluna. Melhor cortar
     a margem do que esconder item — o titulo diz quantos sao. */
  g.className = 'd3';
}
window.addEventListener('resize', function(){ if (painel) ajustarComponentes(); });

function destacarEtapa(){
  var its = document.querySelectorAll('.op-item');
  for (var i = 0; i < its.length; i++) its[i].className = 'op-item';
  var el = $('step' + etapaAtual);
  if (el){ el.className = 'op-item ativo'; scrollParaEtapa(el); }

  var cam = painel.camadas[etapaAtual];
  var ep = $('etapaPrincipal');
  ep.innerHTML = (cam.op || '') + ' <span class="tot">/ ' + painel.camadas.length + '</span>';
  ep.className = ''; void ep.offsetWidth; ep.className = 'pulse';

  var obs = $('obsDisplay');
  if (cam.obs){ obs.innerHTML = '&#9888; ' + cam.obs; obs.style.display = 'block'; }
  else { obs.style.display = 'none'; }

  var grade = $('componentesGrade');
  grade.innerHTML = (cam.componentes || []).map(function(c){
    return '<div class="comp-card"><span class="comp-card-qty">&times;' + c.qtd +
           '</span><span class="comp-card-nome">' + c.nome + '</span></div>';
  }).join('');
  ajustarComponentes();

  mostrarDesenho(etapaAtual);
}

function atualizar(s, total){
  $('timerDisplay').textContent = s + 's';
  var bar = $('progressBar');
  bar.style.transition = (s === total ? 'none' : 'width 1s linear');
  bar.style.width = ((s / (total || 1)) * 100) + '%';
}

/* ---------- tela cheia ---------- */
function pedirFullscreen(){
  try{
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!f) return;
    var r = f.call(el);
    if (r && typeof r['catch'] === 'function') r['catch'](function(){});
  }catch(e){}
}
function sairFullscreen(){
  try{
    var d = document;
    var f = d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen;
    if (f) f.call(d);
  }catch(e){}
}
function emFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
}
function toggleFullscreen(){
  var b = document.querySelector('.btn.fs');
  if (!emFullscreen()){ pedirFullscreen(); if (b) b.innerHTML = '&times; Sair'; }
  else { sairFullscreen(); if (b) b.innerHTML = '&#9974; Tela Cheia'; }
}
document.addEventListener('fullscreenchange', function(){
  var b = document.querySelector('.btn.fs');
  if (b && !emFullscreen()) b.innerHTML = '&#9974; Tela Cheia';
});

/* ---------- troca de produto sem tocar na TV ----------
   ativo.json tem poucos bytes, entao da para checar de minuto em minuto
   sem peso nenhum. Mudou o produto (ou o carimbo), recarrega. */

/* Trocar de produto recarregando a pagina derrubava a tela cheia da TV, e o
   navegador so devolve o modo tela cheia mediante gesto do usuario — ou seja,
   alguem teria que ir ate la com o controle a cada troca. Aqui o conteudo e
   substituido no lugar, sem reload. */
function limparTela(rotulo){
  if (intervalo){ clearInterval(intervalo); intervalo = null; }
  if (fotoTimer){ clearInterval(fotoTimer); fotoTimer = null; }

  for (var k in imgCache){
    if (imgCache.hasOwnProperty(k)){
      try { imgCache[k].parentNode.removeChild(imgCache[k]); } catch(e){}
    }
  }
  imgCache = {};
  etapaAtual = 0; tRestante = 0; tCiclo = 0; fotoAtual = 0;

  var car = $('carousel'); if (car) car.innerHTML = '';
  $('fotoProduto').style.display = 'none';
  $('mapaTrilhos').innerHTML = '';
  $('desenhoPh').style.display = 'block';
  $('desenhoPh').textContent = 'Carregando o produto...';
  $('etapaPrincipal').textContent = rotulo || 'TROCANDO';
  $('obsDisplay').style.display = 'none';
  $('componentesGrade').innerHTML = '<span class="vazio">Carregando...</span>';
  $('produtoNome').textContent = '—';
  painel = null;
}

function trocarPainel(){ limparTela('TROCANDO'); carregar(); }

/* Tira o produto da tela sem recarregar a pagina — a TV perderia a tela cheia. */
function irParaEspera(){ limparTela('SEM PRODUTO'); mostrarEspera(); }

function checarTroca(){
  if (location.protocol.indexOf('http') !== 0 || !window.fetch) return;
  if (emEspera){ checarSaidaDaEspera(); return; }
  if (!painel){ carregar(); return; }

  if (fonte === 'supabase'){
    window.supaGet('embalagem_config?id=eq.1&select=painel_ativo,atualizado_em')
      .then(function(rows){
        redeOk = true;
        var c = rows && rows[0]; if (!c) return;
        var slug = c.painel_ativo ? String(c.painel_ativo) : '';
        if (!slug){ irParaEspera(); return; }          /* tiraram o produto da TV */
        if (slug !== slugAtual){ trocarPainel(); return; }
        /* Mesmo produto: confere se ele foi republicado com correcoes. */
        return window.supaGet('embalagem_paineis?slug=eq.' + encodeURIComponent(slugAtual) +
                              '&select=atualizado_em').then(function(rs){
          var r = rs && rs[0]; if (!r) return;
          var novo = (c.atualizado_em || '') + '|' + (r.atualizado_em || '');
          if (carimboAtual && novo !== carimboAtual) trocarPainel();
        });
      })['catch'](function(){ redeOk = false; });
    return;
  }

  buscarJSON(ATIVO_URL).then(function(a){
    redeOk = true;
    if (!a) return;
    var slug = a.painel ? String(a.painel) : '';
    var carimbo = a.atualizado || null;
    if (!slug){ irParaEspera(); return; }
    if (slug !== slugAtual) trocarPainel();
    else if (carimbo && carimboAtual && carimbo !== carimboAtual) trocarPainel();
  })['catch'](function(){ redeOk = false; });
}
/* Em espera a TV so pergunta se ja escolheram um produto. Nao tenta o arquivo
   de reserva: tela vazia aqui e decisao de quem opera, nao falha para contornar. */
function checarSaidaDaEspera(){
  if (!window.supaGet) return;
  window.supaGet('embalagem_config?id=eq.1&select=painel_ativo')
    .then(function(rows){
      redeOk = true;
      var c = rows && rows[0];
      var slug = (c && c.painel_ativo) ? String(c.painel_ativo) : '';
      if (!slug) return;
      emEspera = false;
      limparTela('CARREGANDO');
      carregar();
    })['catch'](function(){ redeOk = false; });
}

/* ---------- comandos da biblioteca ----------
   Consulta propria, de 5 em 5 segundos, separada da troca de produto: comando
   tem que chegar rapido. Sao dois: pausar/retomar e recarregar o player. */
function checarComandos(){
  if (!window.supaGet) return;
  if (Date.now() < comandosSuspensosAte) return;
  window.supaGet('embalagem_config?id=eq.1&select=tv_pausa,tv_recarregar')
    .then(function(rows){
      var c = rows && rows[0]; if (!c) return;

      /* Recarga: vale ate em espera — e o que traz player novo para a TV. */
      var recarga = c.tv_recarregar || null;
      if (recargaVista === undefined) recargaVista = recarga;   /* primeira leitura: so registra */
      else if (recarga !== recargaVista){ location.reload(); return; }

      if (!painel || emEspera) return;       /* sem produto no ar nao ha o que pausar */
      var novo = c.tv_pausa || null;
      if (novo === pausaRemota) return;      /* nada mudou desde a ultima olhada */
      pausaRemota = novo;
      if (novo && !estaPausado()) alternarPausa();       /* pausaram de longe */
      else if (!novo && estaPausado()) alternarPausa();  /* retomaram de longe */
      pintarRodape();
    })['catch'](function(e){
      /* Erro de schema (coluna que ainda nao existe) volta rapido e sempre igual:
         suspende por 10 minutos em vez de desistir de vez, senao um deploy fora
         de ordem deixaria a TV surda ate o proximo reload. */
      if (e && String(e.message || e).indexOf('400') >= 0) comandosSuspensosAte = Date.now() + 600000;
    });
}

/* Rede de seguranca contra travamento de memoria depois de muitas horas ligada.
   Este reload derruba a tela cheia, entao e raro de proposito: a troca de
   produto, que e o evento frequente, ja acontece sem recarregar. */
function reloadSeguranca(){ if (redeOk) location.reload(); }

/* ---------- cursor do controle remoto ---------- */
var curTimer;
function armarCursor(){
  clearTimeout(curTimer);
  curTimer = setTimeout(function(){
    document.body.style.cursor = 'none';
    var c = document.querySelector('.controls');
    if (c) c.className = 'controls';
  }, 5000);
}
document.addEventListener('mousemove', function(){
  document.body.style.cursor = 'default';
  var c = document.querySelector('.controls');
  if (c) c.className = 'controls visivel';
  armarCursor();
});

document.addEventListener('keydown', function(e){
  if (!painel) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.keyCode === 32){
    e.preventDefault(); alternarPausa();
  } else if (e.code === 'ArrowRight' || e.keyCode === 39 || e.code === 'Enter' || e.keyCode === 13){
    e.preventDefault(); irCamada(1);
  } else if (e.code === 'ArrowLeft' || e.keyCode === 37){
    e.preventDefault(); irCamada(-1);
  } else if (e.code === 'KeyD' || e.keyCode === 68){
    e.preventDefault(); alternarSoDesenho();
  } else if (e.code === 'Escape' || e.keyCode === 27){
    /* Saida de emergencia: Esc so age para VOLTAR, nunca para entrar no modo.
       Em tela cheia o navegador consome a primeira tecla para sair do
       fullscreen e nem entrega o evento aqui — a segunda devolve a tela
       completa. */
    if (modoSoDesenho()){ e.preventDefault(); alternarSoDesenho(); }
  }
});

window.addEventListener('load', function(){
  armarCursor();
  carregar();
  setInterval(checarTroca, 60000);
  setInterval(checarComandos, 5000);
  setInterval(reloadSeguranca, 21600000);
});
</script>
</body>
</html>
